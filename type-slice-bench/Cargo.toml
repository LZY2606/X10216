[package]
name = "type-slice-bench"
version = "0.1.0"
edition = "2021"
description = "类型切片台 — Hindley-Milner 推断过程展示"

[[bin]]
name = "type-slice-bench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
anyhow = "1"

[profile.dev]
opt-level = 0
