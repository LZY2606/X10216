[package]
name = "type-slicer"
version = "0.1.0"
edition = "2021"
description = "类型切片台 — a Hindley-Milner inference workbench with row polymorphism"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[[bin]]
name = "type-slicer"
path = "src/main.rs"

[profile.dev]
opt-level = 0
