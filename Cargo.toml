[package]
name = "type-slice-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[lib]
name = "tsb"
path = "src/lib.rs"

[[bin]]
name = "type-slice-bench"
path = "src/main.rs"
