[package]
name = "type-slice-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.5"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
