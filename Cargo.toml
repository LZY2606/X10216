[package]
name = "type-slice-bench"
version = "0.1.0"
edition = "2021"
description = "类型切片台 - Hindley-Milner 推断过程可视化"

[lib]
name = "type_slice_bench"
path = "src/lib.rs"

[[bin]]
name = "type-slice-bench"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[profile.dev]
opt-level = 0
