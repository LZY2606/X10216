[package]
name = "type-slicer"
version = "0.1.0"
edition = "2021"

[lib]
name = "type_slicer_lib"
path = "type_slicer_lib/src/lib.rs"

[[bin]]
name = "type-slicer"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tower = "0.5"
clap = { version = "4", features = ["derive"] }
