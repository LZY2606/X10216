[package]
name = "type-slicer"
version = "0.1.0"
edition = "2021"
description = "类型切片台：Hindley-Milner 风格语言的约束推断演示"

[lib]
name = "type_slicer"
path = "src/lib.rs"

[[bin]]
name = "type-slicer"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
