[package]
name = "type-slicing-bench"
version = "0.1.0"
edition = "2021"
description = "类型切片台: Hindley-Milner 推断过程切片展示"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.dev]
opt-level = 1
