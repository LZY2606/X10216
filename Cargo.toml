[package]
name = "type-slicing-bench"
version = "0.1.0"
edition = "2021"
description = "类型切片台 — Hindley-Milner 推断过程可视化"

[lib]
name = "typeslicing"
path = "src/lib.rs"

[[bin]]
name = "type-slicing-bench"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0
