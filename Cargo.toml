[package]
name = "type-slicer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[[bin]]
name = "type-slicer"
path = "src/main.rs"

[lib]
name = "type_slicer"
path = "src/lib.rs"
