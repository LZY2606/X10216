[package]
name = "type-slicing-board"
version = "0.1.0"
edition = "2021"
description = "类型切片台：Hindley-Milner 风格语言的增量类型推断、约束图与不可满足核心展示"

[[bin]]
name = "type-slicing-board"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
once_cell = "1"

[dev-dependencies]
serde_json = "1"
