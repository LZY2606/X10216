[package]
name = "type_slicer"
version = "0.1.0"
edition = "2021"
description = "类型切片台: a Hindley-Milner inference workbench with let-polymorphism, records, variants, provenance and unsat cores"

[lib]
name = "type_slicer"
path = "src/lib.rs"

[[bin]]
name = "type_slicer"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
rust-embed = "8"

[dev-dependencies]
serde_json = "1"

[profile.dev]
opt-level = 0
