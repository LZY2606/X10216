[package]
name = "type_slicer"
version = "0.1.0"
edition = "2021"

[lib]
name = "type_slicer"
path = "src/lib.rs"

[[bin]]
name = "type_slicer"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"

[dev-dependencies]
serde_json = "1"
