[package]
name = "type-slicing-bench"
version = "0.1.0"
edition = "2021"
description = "类型切片台 — Hindley-Milner 风格语言的增量类型推断演示"

[[bin]]
name = "type-slicing-bench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"

[profile.dev]
opt-level = 0
