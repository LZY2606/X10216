[package]
name = "type_slice_bench"
version = "0.1.0"
edition = "2021"

[lib]
name = "type_slice_bench"
path = "src/lib.rs"

[[bin]]
name = "type_slice_bench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
rusqlite = { version = "0.37" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

[profile.dev]
opt-level = 0
