[package]
name = "type-slicer"
version = "0.1.0"
edition = "2021"
description = "类型切片台 - Hindley-Milner 推断过程可视化"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
tower-http = { version = "0.5", features = ["fs"] }

[profile.dev]
opt-level = 0
