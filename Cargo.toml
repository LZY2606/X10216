[package]
name = "type-slice"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7.9"
rusqlite = { version = "0.31.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "type-slice"
path = "src/main.rs"

[lib]
name = "type_slice"
path = "src/lib.rs"
