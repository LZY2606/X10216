[package]
name = "type-slicer"
version = "0.1.0"
edition = "2021"
description = "类型切片台：Hindley-Milner 推断过程可视化"

[lib]
name = "type_slicer"
path = "src/lib.rs"

[[bin]]
name = "type-slicer"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[profile.dev]
opt-level = 0
