[package]
name = "type-slice-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[[bin]]
name = "type-slice-bench"
path = "src/main.rs"

[profile.release]
opt-level = 2
