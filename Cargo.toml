[package]
name = "type_slice_bench"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[lib]
name = "type_slice_bench"
path = "src/lib.rs"

[[bin]]
name = "type_slice_bench"
path = "src/main.rs"
