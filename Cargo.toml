[package]
name = "type-slicing-bench"
version = "0.1.0"
edition = "2021"
description = "类型切片台: incremental Hindley-Milner constraint slicing workbench"

[[bin]]
name = "type-slicing-bench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.dev]
opt-level = 0
