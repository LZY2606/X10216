[package]
name = "type-slicing-bench"
version = "0.1.0"
edition = "2021"
description = "类型切片台：Hindley-Milner 风格语言的约束推断与统一步骤可视化"

[[bin]]
name = "type-slicing-bench"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = [] }

[profile.dev]
opt-level = 0
