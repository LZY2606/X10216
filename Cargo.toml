[package]
name = "type_slice_bench"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "type_slice_bench"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
# tests live in tests/ and use the public library API
