[package]
name = "type-slicer-bench"
version = "0.1.0"
edition = "2021"
description = "类型切片台：Hindley-Milner 类型推断过程可视化"

[[bin]]
name = "type-slicer-bench"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1"
thiserror = "1"

[dev-dependencies]
serde_json = "1"
