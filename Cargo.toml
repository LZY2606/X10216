[package]
name = "type-slicer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[lib]
name = "type_slicer"
path = "src/lib.rs"

[[bin]]
name = "type-slicer"
path = "src/main.rs"
