[package]
name = "type-slice-bench"
version = "0.1.0"
edition = "2021"

[lib]
name = "typebench"
path = "src/lib.rs"

[[bin]]
name = "typebench"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
