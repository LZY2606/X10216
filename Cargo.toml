[package]
name = "type-slice-bench"
version = "0.1.0"
edition = "2021"
description = "类型切片台 — Hindley-Milner 推断过程可视化"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "type-slice-bench"
path = "src/main.rs"

[profile.dev]
opt-level = 1
