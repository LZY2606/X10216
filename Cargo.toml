[package]
name = "type-slicer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[[bin]]
name = "type-slicer"
path = "src/main.rs"

[lib]
name = "type_slicer"
path = "src/lib.rs"

[profile.dev]
opt-level = 0
