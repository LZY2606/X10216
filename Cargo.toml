[package]
name = "typeslice"
version = "0.1.0"
edition = "2021"
description = "类型切片台: Hindley-Milner 类型推断过程演示台"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
