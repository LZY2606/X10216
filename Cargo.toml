[package]
name = "type-slicer"
version = "0.1.0"
edition = "2021"
description = "类型切片台: Hindley-Milner 类型推断过程可视化"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
